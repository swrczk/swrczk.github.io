<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Projektant Naszyjnika</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="controls">
            <h2>Kolor</h2>
            <div class="button-group">
                <button onclick="selectOption('color','gold', event)">Złoto</button>
                <button onclick="selectOption('color','silver', event)">Srebro</button>
            </div>

            <h2>Kamienie</h2>
            <div class="button-group">
                <button onclick="selectOption('stones', 'Ametyst', event)">Ametyst</button>
                <button onclick="selectOption('stones', 'KamienKsiezycowy', event)">Kamień księżycowy</button>
                <button onclick="selectOption('stones', 'KamienSloneczny', event)">Kamień słoneczny</button>
                <button onclick="selectOption('stones', 'Lolit', event)">Lolit</button>
                <button onclick="selectOption('stones', 'KocieOkoTurkusowa', event)">Kocie oko - turkusowe</button>
                <button onclick="selectOption('stones', 'KocieOkoFioletowa', event)">Kocie oko - fioletowe</button>
                <button onclick="selectOption('stones', 'KocieOkoZielona', event)">Kocie oko - zielone</button>
                <button onclick="selectOption('stones', 'KocieOkoSzary', event)">Kocie oko - szare</button>
                <button onclick="selectOption('stones', 'BialaMuszla', event)">Biała muszla</button>
                <button onclick="selectOption('stones', 'AmetystLawendowy', event)">Ametyst lawendowy</button>
                <button onclick="selectOption('stones', 'Sodalit', event)">Sodalit</button>
                <button onclick="selectOption('stones', 'OpalSyntetyczny', event)">Opal syntetyczny</button>
                <button onclick="selectOption('stones', 'ZielonaMasaPerlowa', event)">Zielona masa perłowa</button>
                <button onclick="selectOption('stones', 'Fluoryt', event)">Fluoryt</button>
                <button onclick="selectOption('stones', 'KoralNiebieski', event)">Koral niebieski</button>
            </div>


            <h2>Zawieszka</h2>
            <div class="button-group">
                <button onclick="selectOption('pendant', 'sun')">Słońce</button>
                <button onclick="selectOption('pendant', 'moon')">Księżyc</button>
                <button onclick="selectOption('pendant', 'random')">Losowa</button>
            </div>

            <h2>Zapięcie</h2>
            <div class="button-group">
                <button onclick="selectOption('clasp', 'ring')">Kółko</button>
                <button onclick="selectOption('clasp', 'crab')">Krab</button>
            </div>

            <button id="copyButton" onclick="copySelection()">📋 Kopiuj wybór</button>
        </div>

        <div class="preview">
            <canvas id="necklaceCanvas" width="400" height="400"></canvas>
        </div>
    </div>
</body>

<script src="script.js"></script>

</html>
